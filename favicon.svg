<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base redonda con borde sutil -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Chasis del servidor / terminal -->
  <rect x="8" y="9" width="48" height="38" rx="7" fill="url(#screenGrad)" stroke="url(#primaryGrad)" stroke-width="2" />

  <!-- Barra de control / cabecera de ventana -->
  <line x1="8" y1="18" x2="56" y2="18" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="14" cy="13.5" r="1.8" fill="#ef4444" />
  <circle cx="20" cy="13.5" r="1.8" fill="#eab308" />
  <circle cx="26" cy="13.5" r="1.8" fill="#22c55e" />

  <!-- Prompt CLI de sistemas: >_ con brillo cian -->
  <path d="M 16 25 L 23 30.5 L 16 36" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="27" y1="36" x2="35" y2="36" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />

  <!-- Luces LED de servidor / rack en la esquina del terminal -->
  <circle cx="48" cy="27" r="1.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="48" cy="33" r="1.5" fill="#10b981" filter="url(#glow)" />

  <!-- Base / soporte del monitor/servidor -->
  <path d="M 26 47 L 24 53 L 40 53 L 38 47 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="20" y="53" width="24" height="2.5" rx="1.2" fill="#334155" />
</svg>
